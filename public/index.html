<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a14" />

    <!-- Primary Meta Tags (fallbacks if JS is disabled) -->
    <title>ScanMe — Free Custom QR Code Generator with Logo</title>
    <meta
      name="title"
      content="ScanMe — Free Custom QR Code Generator with Logo"
    />
    <meta
      name="description"
      content="Create stunning custom QR codes with your own logo, colors, and patterns. Free forever, no signup. Works 100% in your browser."
    />
    <meta
      name="keywords"
      content="qr code generator, custom qr code, qr code with logo, free qr code, colored qr code, branded qr code"
    />
    <meta name="author" content="ScanMe" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://scan-me-qr.netlify.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scan-me-qr.netlify.app/" />
    <meta property="og:title" content="ScanMe — Free Custom QR Code Generator" />
    <meta
      property="og:description"
      content="Create stunning custom QR codes with your own logo, colors, and patterns. Free forever."
    />
    <meta property="og:image" content="https://scan-me-qr.netlify.app/og-image.png" />
    <meta property="og:site_name" content="ScanMe" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://scan-me-qr.netlify.app/" />
    <meta name="twitter:title" content="ScanMe — Free Custom QR Code Generator" />
    <meta
      name="twitter:description"
      content="Create stunning custom QR codes with your own logo, colors, and patterns."
    />
    <meta name="twitter:image" content="https://scan-me-qr.netlify.app/og-image.png" />

    <!-- Favicon (replace with real favicon files in /public) -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236c5ce7'/><text y='.9em' x='50%' text-anchor='middle' font-size='70' fill='white' font-family='sans-serif'>◈</text></svg>"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Website + Sitelinks Searchbox -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ScanMe",
        "url": "https://scan-me-qr.netlify.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://scan-me-qr.netlify.app/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run ScanMe. ScanMe is a free online QR
      code generator with logo and color customization.
    </noscript>
    <div id="root"></div>
  </body>
</html>
